<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b192c" />
      <stop offset="100%" stop-color="#07111f" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGradient)" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="url(#accentGradient)" stroke-width="1.5" stroke-opacity="0.5" fill="none" />

  <!-- Glowing LM Monogram -->
  <g filter="url(#glow)">
    <!-- Letter L -->
    <path d="M16 18 V46 H30" stroke="url(#accentGradient)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Letter M -->
    <path d="M32 46 V18 L40.5 32 L49 18 V46" stroke="url(#accentGradient)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Terminal accent dot -->
  <circle cx="53" cy="45" r="2.5" fill="#5eead4" />
</svg>
